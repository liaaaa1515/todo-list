<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高效TodoList | 前端实习项目</title>
    <!-- shadcn/ui 风格样式 -->
    <link rel="stylesheet" href="./css/index.css">
    <!-- 字体图标 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="bi bi-check2-square"></i> 我的待办清单</h1>
            <p class="subtitle">高效管理每一天</p>
        </header>
        
        <!-- 输入区域 -->
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="请输入待办事项...">
            <button id="add-btn"><i class="bi bi-plus-lg"></i> 添加</button>
        </div>

        <!-- 筛选 + 统计 -->
        <div class="filter-stats-group">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="active">未完成</button>
                <button class="filter-btn" data-filter="completed">已完成</button>
            </div>
            <div class="stats">
                <span id="stats-text">剩余 <b id="active-count">0</b> 项待办</span>
            </div>
        </div>

        <!-- 待办列表 -->
        <ul id="todo-list" class="todo-list"></ul>
        
        <!-- 清空已完成按钮 -->
        <button id="clear-completed" class="clear-btn">
            <i class="bi bi-trash"></i> 清空已完成
        </button>
    </div>

    <script src="./js/app.js"></script>
</body>
</html>
